name: Profile README assets

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [master, main]

permissions:
  contents: write

concurrency:
  group: profile-readme-assets
  cancel-in-progress: true

jobs:
  update-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate contribution snake (SVG + GIF)
        uses: Platane/snk@v3
        with:
          github_user_name: hello-args
          outputs: |
            assets/github-contribution-grid-snake.svg?palette=github-dark&color_snake=4ADE80
            assets/github-contribution-grid-snake.gif?palette=github-dark&color_snake=4ADE80&color_background=0B1220

      - name: Download activity graph
        run: |
          mkdir -p assets
          curl -fsSL "https://github-readme-activity-graph.vercel.app/graph?username=hello-args&theme=react-dark&hide_border=true&bg_color=0B1220&color=059669&line=4ADE80&point=2DD4BF&area=true&height=200" \
            -o assets/github-activity-graph.svg || true

      - name: Update recent OSS contributions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: hello-args
        run: python3 .github/scripts/update_recent_oss.py

      - name: Generate joke ticker SVG
        run: python3 .github/scripts/generate_joke_svg.py

      - name: Commit updated assets
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update profile README assets [skip ci]"
          file_pattern: |
            assets/*
            README.md
